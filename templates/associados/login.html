{% extends 'noticias/base.html' %}
{% load static %}

{% block content %}
     <div class="container mt-5">
        <h2 class="form-label text-secondary">Login</h2>
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}

                <div class="row">
                    {% for field in form.visible_fields %}
                    <div class="form-label text-secondary" style="margin-bottom: 10px;">
                        <label for="{{ field.id_for_label }}" style="color:#D9D9D9; margin-bottom: 5px;">{{field.label}}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                </div>
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} custom-alert">
                    <p id="messages">{{message}}</p>
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Entrar</button>

            <div class="mt-3">
                <p>Não tem uma conta? <a href="{% url 'cadastro' %}">Cadastre-se aqui</a></p>
            </div>
        </form>

    </div>
{% endblock %}
